# Landing page → GitHub Pages
# 推送到 main 后自动构建 landing/ 并发布到
# https://keliq-wq.github.io/AI_Firewall/
name: deploy-landing

on:
  push:
    branches: [main]
    paths:
      - "landing/**"
      - ".github/workflows/deploy-landing.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: landing/package-lock.json
      - name: Install
        run: npm ci
        working-directory: landing
      - name: Build (static export)
        run: npm run build
        working-directory: landing
        env:
          NEXT_PUBLIC_BASE_PATH: /AI_Firewall
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: landing/out
      - id: deployment
        uses: actions/deploy-pages@v4
