<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Agent 交易防火墙 · 演示控制台</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">🛡️</span>
      <div>
        <h1>AI Agent 交易防火墙</h1>
        <p class="sub">三层防御 · CLAW 四门协议 · 实时演示控制台</p>
      </div>
    </div>
    <div class="topbar-right">
      <span class="chip" id="rpc-chip"><span class="dot dot-unknown"></span><span id="rpc-label">连接中…</span></span>
      <span class="chip mono" id="wallet-chip" title="">钱包 —</span>
    </div>
  </header>

  <main class="layout">
    <section class="panel main-panel">
      <h2>攻击剧本</h2>
      <p class="hint">点击发起一笔攻击交易，观察防火墙在签名前的实时拦截。全部走真实 RPC 模拟执行。</p>
      <div class="scenarios" id="scenarios"><!-- 按钮由 /api/scenarios 生成 --></div>

      <div class="result-card" id="result-card">
        <div class="result-empty" id="result-empty">← 点击左侧剧本，查看防火墙判定</div>
        <div class="result-body" id="result-body" hidden>
          <div class="result-head">
            <span class="verdict" id="verdict">—</span>
            <div>
              <div class="result-title" id="result-title">—</div>
              <div class="result-summary" id="result-summary">—</div>
            </div>
          </div>
          <ul class="concerns" id="concerns"></ul>
          <blockquote class="narration" id="narration"></blockquote>
        </div>
      </div>
    </section>

    <aside class="panel side-panel">
      <h2>策略</h2>
      <dl class="kv" id="policy-kv"></dl>

      <h2>24h 滚动支出</h2>
      <div class="meter" id="meter">
        <div class="meter-track"><div class="meter-fill" id="meter-fill"></div></div>
        <div class="meter-label" id="meter-label">0 / 2 SOL</div>
      </div>

      <h2>链上状态</h2>
      <dl class="kv" id="chain-kv"></dl>

      <h2>事件时间线</h2>
      <ul class="timeline" id="timeline"></ul>
    </aside>
  </main>

  <footer class="foot">
    <span>Layer 1 客户端快速拒绝 · Layer 2 模拟执行验证 · Layer 3 链上强制金库</span>
  </footer>

  <script src="/app.js"></script>
</body>
</html>
